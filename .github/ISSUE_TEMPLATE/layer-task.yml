name: "Layer 작업"
description: "현재 Layer의 범위와 책임 경계를 확정하는 구현 명세"
body:
  - type: markdown
    attributes:
      value: "확정한 명세를 AI/사람에게 전달하세요. 미확인 finding이나 미공개 PoC는 공개 Issue에 올리지 말고 SECURITY.md를 따르세요. 해당 없으면 이유를 적으세요."
  - type: dropdown
    id: layer
    attributes:
      label: "현재 Layer"
      description: "STATUS 기준으로 선택"
      options:
        - "Documentation / Environment / Project Foundation"
        - "Layer 0"
        - "Layer 1"
        - "Layer 2"
        - "Layer 3"
        - "Layer 4"
        - "Layer 5"
        - "Layer 6"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: "작업 목표"
      description: "하나의 구체적인 동작/산출물"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "왜 필요한가"
      description: "문제와 기대 효과"
    validations:
      required: true
  - type: textarea
    id: allowed
    attributes:
      label: "수정 가능한 모듈"
      description: "허용 파일/경로와 interface"
    validations:
      required: true
  - type: textarea
    id: forbidden
    attributes:
      label: "건드리면 안 되는 모듈"
      description: "금지 영역과 현재 Layer 이후 기능"
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: "입력"
      description: "데이터, 설정, 전제조건"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: "출력"
      description: "결과, 실패 시 동작"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: "완료 조건"
      description: "검증 가능한 기준과 make check"
    validations:
      required: true
  - type: dropdown
    id: security_contract
    attributes:
      label: "관련 Security Contract"
      description: "정의는 security-contracts.md 기준"
      options:
        - "직접 관련 없음"
        - "Path Boundary Confinement"
        - "Object Identity Confinement"
        - "External Effect Noninterference"
        - "Extraction Root Integrity"
        - "Check/Use Coherence"
        - "여러 Contract — 관련 문서에 명시"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: "Generic / Target-specific"
      description: "책임 경계를 선택"
      options:
        - "Generic"
        - "Target-specific"
        - "둘 다 — 허용 영역에 경계 명시"
        - "문서 / 환경"
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: "필요한 테스트"
      description: "정상/실패/경계 조건"
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: "관련 문서"
      description: "읽을 문서, 갱신할 문서와 관련 Issue"
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: 작업 명세 확인
      options:
        - label: "작업 범위와 완료 조건을 확인했고 root 및 관련 scoped AGENTS와 연구·안전 규칙을 따릅니다."
          required: true
