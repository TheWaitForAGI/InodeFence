name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INODEFENCE_RUNTIME_ROOT: /var/lib/inodefence
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare packaging tools
        # Python checks remain canonical; Node is solely for benign adapter fixtures.
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Set up pinned Node for benign adapter tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - name: Install locked benign adapter dependency
        run: make target-tools
      - name: Install development dependencies
        run: make install
      - name: Prepare Linux runtime directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 "$INODEFENCE_RUNTIME_ROOT"
      - name: Check
        run: make check

  container-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up host broker Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build trusted controller and benign helper
        run: |
          docker build -f .devcontainer/Dockerfile -t inodefence-controller:ci .
          docker build -f tools/container-helper/Dockerfile -t inodefence-helper:ci .
          docker build -f tools/node-tar/Dockerfile -t inodefence-node-tar:ci .
      - name: Prepare independent trusted Linux controller
        run: |
          docker volume create inodefence-ci-runtime
          docker run -d --name inodefence-ci-controller --user vscode --workdir /workspaces/InodeFence --env PYTHONPATH=/workspaces/InodeFence/src --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspaces/InodeFence,readonly" --mount type=volume,src=inodefence-ci-runtime,dst=/var/lib/inodefence inodefence-controller:ci sleep infinity
          docker exec --user root inodefence-ci-controller chown vscode:vscode /var/lib/inodefence
          docker exec inodefence-ci-controller python -m pip install pytest
          docker exec inodefence-ci-controller git config --global --add safe.directory /workspaces/InodeFence
      - name: Real container boundary regressions
        run: |
          IF_HELPER_IMAGE=$(docker image inspect inodefence-helper:ci --format '{{.Id}}')
          PYTHONPATH=src python -m scripts.container_host --context default --controller inodefence-ci-controller --volume inodefence-ci-runtime --image "$IF_HELPER_IMAGE" validate
      - name: Pinned Node image metadata through the validated backend
        run: |
          IF_NODE_IMAGE=$(docker image inspect inodefence-node-tar:ci --format '{{.Id}}')
          PYTHONPATH=src python -m scripts.container_host --context default --controller inodefence-ci-controller --volume inodefence-ci-runtime --image "$IF_NODE_IMAGE" validate-node-image
          PYTHONPATH=src python -m scripts.container_host --context default --controller inodefence-ci-controller --volume inodefence-ci-runtime --image "$IF_NODE_IMAGE" validate-node-target
      - name: Tiny benign configured Node campaign
        run: |
          IF_NODE_IMAGE=$(docker image inspect inodefence-node-tar:ci --format '{{.Id}}')
          PYTHONPATH=src python -m scripts.container_host --context default --controller inodefence-ci-controller --volume inodefence-ci-runtime --image "$IF_NODE_IMAGE" --evidence /tmp/inodefence-node-smoke-evidence benign-node-smoke
      - name: Effect producer smoke on the pinned Node image (make node-tar-effect-check)
        run: |
          IF_NODE_IMAGE=$(docker image inspect inodefence-node-tar:ci --format '{{.Id}}')
          PYTHONPATH=src python -m scripts.container_host --context default --controller inodefence-ci-controller --volume inodefence-ci-runtime --image "$IF_NODE_IMAGE" validate-node-effect-producer
      - name: Tiny real node-tar effect demo (make demo path, 4 seeds + 2 mutations)
        run: |
          IF_NODE_IMAGE=$(docker image inspect inodefence-node-tar:ci --format '{{.Id}}')
          PYTHONPATH=src python -m scripts.container_host --context default --controller inodefence-ci-controller --volume inodefence-ci-runtime --image "$IF_NODE_IMAGE" --evidence /tmp/inodefence-effect-demo-ci.json --budget 6 effect-demo
      - name: Preserve produced smoke evidence, including unexpected contract evidence
        if: always()
        run: |
          if docker exec inodefence-ci-controller test -d /tmp/inodefence-node-smoke-evidence; then
            docker cp inodefence-ci-controller:/tmp/inodefence-node-smoke-evidence ./container-smoke-evidence
          fi
          mkdir -p ./container-smoke-evidence
          for name in inodefence-effect-demo-ci.json inodefence-effect-demo-ci.steps.jsonl; do
            if docker exec inodefence-ci-controller test -e "/tmp/$name"; then
              docker cp "inodefence-ci-controller:/tmp/$name" "./container-smoke-evidence/$name"
            fi
          done
      - name: Upload produced raw engineering evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benign-node-container-smoke
          path: container-smoke-evidence
          if-no-files-found: warn
      - name: Remove only this job's trusted controller and volume
        if: always()
        run: |
          docker rm -f inodefence-ci-controller
          docker volume rm inodefence-ci-runtime
