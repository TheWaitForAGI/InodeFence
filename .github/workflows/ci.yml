name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INODEFENCE_RUNTIME_ROOT: /var/lib/inodefence
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare packaging tools
        # Python checks remain canonical; Node is solely for benign adapter fixtures.
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Set up pinned Node for benign adapter tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - name: Install locked benign adapter dependency
        run: make target-tools
      - name: Install development dependencies
        run: make install
      - name: Prepare Linux runtime directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 "$INODEFENCE_RUNTIME_ROOT"
      - name: Check
        run: make check
