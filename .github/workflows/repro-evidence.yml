name: repro-evidence

# Manually dispatched controlled re-runs of the committed M2/M4 evidence commands at
# the dispatched commit, on a fresh GitHub-hosted runner (never on the experiment hosts).
#
# Label: controlled repro / controlled check. This is not a registered campaign; the
# exposure ledger, preregistration files and committed evidence are not changed.
# Every comparison is report-only: re-run output goes to a scratch folder and is diffed
# against the committed JSON; nothing under the repository is overwritten, nothing is
# pushed, published or released. Historical node-tar / oras-go / decompress images are
# built on the runner from the committed hash-pinned recipes and discarded with it.
#
# Steps:
#   1. oracle_fixture_check (no docker): normal input clean, c0/c1/c2 fixtures fire
#      C0 / C1+C2 / C2 on a controlled extractor (not node-tar).
#   2. node-tar effect images 7.5.2, 7.5.3, 7.5.6, 7.5.7, 7.5.8 from
#      tools/node-tar/effect/Dockerfile + tools/node-tar/versions/<v>/.
#   3. experiments/repro/cross_release_identity.py --out scratch, compared with
#      experiments/repro/evidence/{summary,toplevel_hardlink,nested_hardlink}.json.
#   4. scripts/regression_check.py --tar-version 7.5.2 (what `make regression` runs, called
#      directly so its own exit code is kept; make would turn every failure into 2).
#      Verdict names: FAIL = a known C1/C2 fixture still breaches. On 7.5.2 FAIL is the
#      EXPECTED verdict (exit 1 plus the line "REGRESSION FAIL node-tar=7.5.2").
#   5. oras-go and decompress native probes --out scratch, compared with committed JSON.
# Comparisons: summary.json and a verdict-only projection of each fixture/probe JSON are
# the comparison. The full-file diffs are kept for reference; they normally differ because
# they carry raw dev/ino values and runner-built image ids.
# Output: artifact repro-evidence-<run_id> with every output, diff, exit code, image id
# and SHA256SUMS. The job fails when a command ends with an unexpected exit code, when the
# regression line is not the expected FAIL line, or when a scratch output is missing; a
# difference from the committed evidence is reported, not treated as failure.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INODEFENCE_RUNTIME_ROOT: /var/lib/inodefence
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
      OUT: ${{ github.workspace }}/repro-out
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          make install
      - name: Prepare runtime directory, output folder and comparison helper
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 "$INODEFENCE_RUNTIME_ROOT"
          mkdir -p "$OUT"
          {
            echo "commit $GITHUB_SHA"
            echo "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "label controlled repro (not a registered campaign; ledger unchanged)"
            docker version --format 'docker server {{.Server.Version}}'
            date -u '+started %Y-%m-%dT%H:%M:%SZ'
          } > "$OUT/run-info.txt"
          cat "$OUT/run-info.txt"
          # compare <name> <committed json> <scratch json>: full diff (reference) + verdict-only projection diff (the comparison)
          cat > "$RUNNER_TEMP/compare.sh" <<'SH'
          name=$1; committed=$2; scratch=$3
          if [ ! -f "$scratch" ]; then
            echo "$name: MISSING scratch output $scratch" | tee -a "$OUT/comparisons.txt"
            echo "$name missing" >> "$OUT/missing.txt"
            exit 0
          fi
          diff -u "$committed" "$scratch" > "$OUT/$name.full.diff"
          python "$RUNNER_TEMP/project.py" "$committed" > "$OUT/$name.verdict.committed.json"
          python "$RUNNER_TEMP/project.py" "$scratch" > "$OUT/$name.verdict.rerun.json"
          diff -u "$OUT/$name.verdict.committed.json" "$OUT/$name.verdict.rerun.json" > "$OUT/$name.verdict.diff"
          v=$([ -s "$OUT/$name.verdict.diff" ] && echo DIFFERS || echo identical)
          f=$([ -s "$OUT/$name.full.diff" ] && echo differs || echo identical)
          echo "$name: verdict projection $v (comparison); full file $f (reference only, raw dev/ino/image ids)" | tee -a "$OUT/comparisons.txt"
          SH
          cat > "$RUNNER_TEMP/project.py" <<'PY'
          """Keep only the fields that carry the judgement in a repro JSON (summary, fixture or probe)."""
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          if "releases" in d:  # cross_release fixture file
              out = {"fixture": d.get("fixture"), "fixed_pair": d.get("fixed_pair"),
                     "verdicts": {r: v.get("verdict") for r, v in sorted(d["releases"].items())}}
          elif "per_role" in d:  # oras-go / decompress probe
              out = {k: d.get(k) for k in ("fixture", "affected_shared", "fixed_shared", "boundary_ok")}
              out["verdicts"] = {r: v.get("verdict") for r, v in sorted(d["per_role"].items())}
          else:  # summary.json is already verdict-level
              out = d
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: "1. Oracle fixture check (controlled extractor, not node-tar)"
        run: |
          set +e
          PYTHONPATH=src python -m scripts.oracle_fixture_check > "$OUT/oracle_fixture_check.txt" 2>&1
          echo "oracle_fixture_check rc=$? (expected 0)" | tee -a "$OUT/exit-codes.txt"
          cat "$OUT/oracle_fixture_check.txt"

      - name: "2. Build node-tar effect images from the committed recipes"
        run: |
          echo "# runner-built image ids from the committed recipes; NOT the frozen registration digests" > "$OUT/image-ids.txt"
          for v in 7.5.2 7.5.3 7.5.6 7.5.7 7.5.8; do
            docker build -q -f tools/node-tar/effect/Dockerfile --build-arg "TAR_VERSION=$v" \
              -t "inodefence-node-tar-effect:$v" . > /dev/null
            echo "inodefence-node-tar-effect:$v $(docker image inspect --format '{{.Id}}' "inodefence-node-tar-effect:$v")" \
              | tee -a "$OUT/image-ids.txt"
          done

      - name: "3. Cross-release identity repro (compared with committed evidence, report-only)"
        run: |
          set +e
          python experiments/repro/cross_release_identity.py --out "$OUT/cross_release" > "$OUT/cross_release.stdout.txt" 2>&1
          echo "cross_release_identity rc=$? (expected 0)" | tee -a "$OUT/exit-codes.txt"
          for f in summary toplevel_hardlink nested_hardlink; do
            bash "$RUNNER_TEMP/compare.sh" "cross_release.$f" "experiments/repro/evidence/$f.json" "$OUT/cross_release/$f.json"
          done

      - name: "4. Regression check 7.5.2 (FAIL = breach = expected on 7.5.2)"
        run: |
          set +e
          echo "NOTE: regression verdict names: FAIL means a known C1/C2 fixture still breaches. On 7.5.2 FAIL (rc 1 with the line 'REGRESSION FAIL node-tar=7.5.2') is the expected verdict. Called directly (same command as make regression) so the script's own exit code is kept." \
            | tee "$OUT/regression-7.5.2.note.txt"
          PYTHONPATH=src:. python scripts/regression_check.py --tar-version 7.5.2 --out "$OUT/regression-7.5.2.json" \
            > "$OUT/regression-7.5.2.stdout.txt" 2>&1
          echo "regression_check 7.5.2 rc=$? (expected 1 = FAIL = breach)" | tee -a "$OUT/exit-codes.txt"
          cat "$OUT/regression-7.5.2.stdout.txt"

      - name: "5. oras-go and decompress native probes (compared with committed evidence, report-only)"
        run: |
          set +e
          python experiments/repro/oras_go_cwd_hardlink.py --out "$OUT/oras_go" > "$OUT/oras_go.stdout.txt" 2>&1
          echo "oras_go_cwd_hardlink rc=$? (expected 0)" | tee -a "$OUT/exit-codes.txt"
          python experiments/repro/decompress_hardlink.py --out "$OUT/decompress" > "$OUT/decompress.stdout.txt" 2>&1
          echo "decompress_hardlink rc=$? (expected 0)" | tee -a "$OUT/exit-codes.txt"
          bash "$RUNNER_TEMP/compare.sh" oras_go experiments/repro/evidence/oras_go_cwd_hardlink.json "$OUT/oras_go/oras_go_cwd_hardlink.json"
          bash "$RUNNER_TEMP/compare.sh" decompress experiments/repro/evidence/decompress_hardlink.json "$OUT/decompress/decompress_hardlink.json"

      - name: Summary, residual check and SHA256SUMS
        if: always()
        run: |
          {
            date -u '+finished %Y-%m-%dT%H:%M:%SZ'
            echo "residual containers $(docker ps -aq | wc -l)"
          } >> "$OUT/run-info.txt"
          echo "== exit codes"; cat "$OUT/exit-codes.txt" 2>/dev/null
          echo "== comparisons (report-only)"; cat "$OUT/comparisons.txt" 2>/dev/null
          (cd "$OUT" && find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.tmp | sort | xargs sha256sum > SHA256SUMS.tmp && mv SHA256SUMS.tmp SHA256SUMS)

      - name: Upload repro evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-evidence-${{ github.run_id }}
          path: repro-out
          if-no-files-found: warn

      - name: Fail on unexpected exit codes, a non-FAIL regression line or a missing output
        run: |
          grep -q '^oracle_fixture_check rc=0 ' "$OUT/exit-codes.txt"
          grep -q '^cross_release_identity rc=0 ' "$OUT/exit-codes.txt"
          grep -q '^regression_check 7.5.2 rc=1 ' "$OUT/exit-codes.txt"
          grep -q '^REGRESSION FAIL node-tar=7.5.2 ' "$OUT/regression-7.5.2.stdout.txt"
          grep -q '^oras_go_cwd_hardlink rc=0 ' "$OUT/exit-codes.txt"
          grep -q '^decompress_hardlink rc=0 ' "$OUT/exit-codes.txt"
          [ ! -s "$OUT/missing.txt" ]
