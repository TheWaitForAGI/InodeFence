[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inodefence"
version = "0.2.0"
description = "Filesystem-security-state-guided fuzzing for TAR extraction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

# The user-facing command. The product drivers (inodefence.drivers) are packaged, but commands
# that run targets still need a clone (editable install, or INODEFENCE_HOME set): the build assets
# under tools/ and the controller launchers under scripts/ are not packaged. `doctor`, `status`
# and `summary` work from any install. See README.
[project.scripts]
inodefence = "inodefence.cli:main"

[project.optional-dependencies]
# The command itself needs none of these (dependencies = []). Each interface extra is optional:
# `ui` draws the terminal with Rich (without it the plain screens are used); `tui` is for
# `inodefence tui` (Textual); `web` is for `inodefence dashboard` (FastAPI + uvicorn).
# Lower bounds: the stable releases installable on 2026-11-19 were rich 15.0 and textual 8.2.
ui = ["rich>=13"]
tui = ["textual>=8", "rich>=13"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["rich>=13", "textual>=8", "fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.400,<2",
    "rich>=13",  # so the Rich renderer is tested too (the plain one is tested with Rich blocked)
    "textual>=8",  # so the TUI tests run in CI instead of skipping
    "fastapi>=0.110",  # so the web tests run in CI instead of skipping
    "uvicorn>=0.29",
    "httpx>=0.27",  # FastAPI's TestClient
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inodefence.targets" = ["*.cjs"]
"inodefence.ui.web.static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "scripts", "tests"]
