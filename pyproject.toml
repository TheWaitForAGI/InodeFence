[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inodefence"
version = "0.2.0"
description = "Filesystem-security-state-guided fuzzing for TAR extraction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

# The user-facing command. The product drivers (inodefence.drivers) are packaged, but commands
# that run targets still need a clone (editable install, or INODEFENCE_HOME set): the build assets
# under tools/ and the controller launchers under scripts/ are not packaged. `doctor`, `status`
# and `summary` work from any install. See README.
[project.scripts]
inodefence = "inodefence.cli:main"

[project.optional-dependencies]
# The command itself needs none of these (dependencies = []). Each interface extra is optional:
# `ui` draws the terminal with Rich (without it the plain screens are used). The `tui` (Textual)
# and web extras are added together with the commands that use them, not before. Lower bound:
# the stable Rich release installable on 2026-11-19 was 15.0.
ui = ["rich>=13"]
all = ["rich>=13"]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.400,<2",
    "rich>=13",  # so the Rich renderer is tested too (the plain one is tested with Rich blocked)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inodefence.targets" = ["*.cjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "scripts", "tests"]
