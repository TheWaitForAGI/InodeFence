<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InodeFence dashboard</title>
  <!-- One palette, served from the shared theme module. No external stylesheet, font or script. -->
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app">
    <nav id="sidenav" aria-label="Sections">
      <div class="brand"><span class="brand-mark" aria-hidden="true">◆</span> InodeFence</div>
      <ul class="nav-list">
        <li><a href="#/overview" data-nav="overview"><span class="nav-sym" aria-hidden="true">▦</span> Overview</a></li>
        <li><a href="#/targets" data-nav="targets"><span class="nav-sym" aria-hidden="true">◉</span> Targets</a></li>
        <li><a href="#/experiments" data-nav="experiments"><span class="nav-sym" aria-hidden="true">▤</span> Experiments</a></li>
        <li><a href="#/findings" data-nav="findings"><span class="nav-sym" aria-hidden="true">⚑</span> Findings</a></li>
        <li><a href="#/replay" data-nav="replay"><span class="nav-sym" aria-hidden="true">↻</span> Replay</a></li>
        <li><a href="#/artifacts" data-nav="artifacts"><span class="nav-sym" aria-hidden="true">▧</span> Artifacts</a></li>
      </ul>
      <div class="nav-foot">read-only · local</div>
    </nav>
    <div id="layout">
      <header id="topbar">
        <div class="title" id="page-title">Overview</div>
        <div class="search">
          <input id="search" type="search" placeholder="Filter runs and findings…" autocomplete="off" spellcheck="false">
        </div>
        <div class="chips">
          <span class="chip chip-muted" id="chip-conn" title="Live event stream">· stream</span>
          <span class="chip chip-muted" id="chip-engine" title="Engine / environment health">· engine</span>
        </div>
      </header>
      <main id="view" aria-live="polite"><!-- rendered by app.js --></main>
    </div>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>
